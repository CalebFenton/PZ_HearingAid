# shellcheck shell=bash
# What the shared test harness in dev/harness needs to know about this mod; its scripts source
# this. dev/harness/docs/adopting.md describes every key and hook. Paths are relative to the
# repository.

MOD_DIR=Contents/mods/HearingAid
DEV_MOD_DIR=dev/HearingAidDevHarness
# Cache dirs under $TMPDIR: <name>-client, <name>-server, <name>-mpclient, <name>-mpserver and
# <name>-check.
CACHE_NAME=pz-hearingaid
TAG=HearingAidTest
# What every game run of the harness checks first: a game started on Lua that doesn't compile, or
# on a script or translation the game rejects, costs a game start to learn what this finds in
# seconds.
PRECHECK=(dev/static-check.sh)
# Every text of the mod is translated into each language the game offers, so the static check
# fails on a language missing a translation file or key, rather than noting it.
CHECK_ALL_LANGUAGES=1
# What a kept --test --stay game loads again for a rerun, relative to the dev mod; with --mp the
# server loads the server files again too.
RELOAD_FILES=('42/media/lua/client/HearingAid/Debug/HearingAidTest*.lua'
    '42/media/lua/server/HearingAid/Debug/HearingAidTest*.lua')
# The tests that --changed runs for each changed file: those that reach its code, through the
# fixtures and server handlers too. A file with no entry runs every test; that is left to what
# nearly every test touches, such as HearingAid.lua, HearingAidServer.lua, the body locations, the
# item script, the clothing items, the sandbox options, the tests and their server handlers, and
# the dev mod's setup and scenario. An empty list marks a file no test exercises: art, the tooltip,
# text that no test reads (dev/static-check.sh checks the translations) and the art and promo
# modes.
TEST_MAP=('Contents/mods/HearingAid/42/hearing_aid_icon.png='
    'Contents/mods/HearingAid/42/poster.png='
    'Contents/*/common/media/models_X/*='
    'Contents/*/common/media/textures/*='
    'Contents/*/client/HearingAid/HearingAidClient.lua=hearingaid_battery_runs_out'
    'Contents/*/client/HearingAid/HearingAidMenu.lua=hearingaid_context_menu,hearingaid_wear_menu_ears,hearingaid_wear_switched_on_aid_on_left_ear,hearingaid_switch_ears_while_worn'
    'Contents/*/client/HearingAid/HearingAidTooltip.lua='
    'Contents/*/server/HearingAid/HearingAidDistributions.lua=hearingaid_corpse_loot'
    'Contents/*/shared/HearingAid/HearingAidRecipes.lua=hearingaid_craft_'
    'Contents/*/shared/TimedActions/HearingAidAction.lua=hearingaid_context_menu,hearingaid_handle_deafness_option,hearingaid_insert_battery,hearingaid_keeps_outside_trait_changes,hearingaid_remove_battery,hearingaid_turn_'
    'Contents/*/Translate/*='
    'Contents/*/Translate/*/ContextMenu.json=hearingaid_context_menu,hearingaid_wear_menu_ears,hearingaid_wear_switched_on_aid_on_left_ear,hearingaid_switch_ears_while_worn'
    'Contents/*/scripts/HearingAid_recipes.txt=hearingaid_craft_'
    'dev/HearingAidDevHarness/*/HearingAidDevArt.lua='
    'dev/HearingAidDevHarness/*/HearingAidDevPromo.lua='
    'dev/harness/mod/*/PZHarness/Capture.lua='
    'dev/HearingAidDevHarness/*/HearingAidLoot.lua=hearingaid_corpse_loot')

MODES='art promo loot'
MODE_MARK_art=HearingAidArt
MODE_MARK_promo=HearingAidPromo
MODE_SELECTION_promo=PROMO
# The world shot last, so that the world's light has caught up with the run's noon.
MODE_GROUPS_promo='icons heads models tooltips menu world'
MODE_CAPTURES_promo=art/promo/captures
MODE_MARK_loot=HearingAidLootReport

# Script warnings name the item or recipe, and HearingAidDistributions.lua prints
# "HearingAid: missing" for unknown loot lists.
SERVER_PROBLEMS='HearingAid: missing|^(WARN|ERROR).*[Hh]earing ?[Aa]id'
